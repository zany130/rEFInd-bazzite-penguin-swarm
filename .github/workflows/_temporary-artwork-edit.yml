name: Temporary artwork update (remove after use)
on:
  push:
    branches:
      - fix/penguin-label-readability
permissions:
  contents: write
jobs:
  update-png:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install temporary raster processing dependencies
        run: python -m pip install --quiet pillow numpy opencv-python-headless
      - name: Update only background.png
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          import numpy as np
          p="background.png"
          a=np.asarray(Image.open(p).convert("RGB")).copy()
          h,w=a.shape[:2]
          yy=np.arange(h,dtype=np.float32)[:,None]
          xx=np.arange(w,dtype=np.float32)[None,:]
          shadow=(.84*np.exp(-.5*((yy-1552)/38)**2)*np.exp(-.5*((xx-1920)/820)**2)).astype(np.float32)
          a=np.clip(a.astype(np.float32)*(1-shadow[:,:,None]),0,255).astype(np.uint8)
          Image.fromarray(a).save(p,compress_level=6)
          PY
      - name: Commit updated PNG without build scripts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add background.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update final rEFInd wallpaper artwork"
          git push origin HEAD:fix/penguin-label-readability
