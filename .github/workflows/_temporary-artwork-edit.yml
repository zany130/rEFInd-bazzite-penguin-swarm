name: Temporary artwork update (remove after use)
on:
  push:
    branches:
      - fix/penguin-label-readability
permissions:
  contents: write
jobs:
  update-png:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --quiet pillow numpy
      - name: Shift cyan horizon to electric blue to improve auto text contrast
        shell: bash
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:background.png > background.png
          python - <<'PY'
          from PIL import Image
          import numpy as np
          p='background.png'
          src=np.asarray(Image.open(p).convert('RGB'))
          h,w=src.shape[:2]
          y=np.arange(h,dtype=np.float32)[:,None]
          x=np.arange(w,dtype=np.float32)[None,:]
          m=np.exp(-.5*((y-1550)/100)**2)*np.exp(-.5*((x-1920)/1350)**2)
          a=src.astype(np.float32)
          a[:,:,0]*=(1-.86*m)
          a[:,:,1]*=(1-.65*m)
          a=np.clip(a,0,255).astype('uint8')
          Image.fromarray(a).save(p,compress_level=6)
          PY
      - name: Commit just the updated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add background.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Adjust bright Penguin Swarm horizon for white rEFInd label"
          git push origin HEAD:fix/penguin-label-readability
