name: Rebuild approved Penguin Swarm background

on:
  push:
    branches:
      - fix/approved-concept-background
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-background:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build faithful background from checked-in sources
        run: |
          python -m pip install --disable-pip-version-check Pillow numpy
          python scripts/rebuild_approved_background.py
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          assert Image.open('background.png').size == (3840, 2160)
          assert Image.open('source/clean-background-1672x941.png').size == (1672, 941)
          print('Validated new wallpaper dimensions')
          PY
      - name: Commit rebuilt background assets to this branch
        run: |
          git add background.png source/clean-background-1672x941.png
          if git diff --cached --quiet; then
            echo "Assets already match the approved concept"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Regenerate 4K penguin background from approved artwork'
          git push origin "HEAD:${GITHUB_REF_NAME}"
